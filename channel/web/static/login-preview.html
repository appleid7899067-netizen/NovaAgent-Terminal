<!doctype html>
<html lang="th" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เข้าสู่ระบบ · boss.slilelo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#090a0f;
    --surface:#14151e;
    --surface-2:#1a1b26;
    --line:rgba(255,255,255,.08);
    --text:#e6e8ef;
    --muted:#8b90a3;
    --cyan:#00d4ff;
    --violet:#7b61ff;
    --danger:#ff5c7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:24px;
  }
  /* ambient neon glow, very subtle */
  .glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:.28;pointer-events:none;z-index:0}
  .glow.a{width:420px;height:420px;background:var(--cyan);top:-140px;left:-120px}
  .glow.b{width:460px;height:460px;background:var(--violet);bottom:-180px;right:-140px}
  .glow.c{width:260px;height:260px;background:var(--violet);top:40%;left:55%;opacity:.14}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:392px;
    padding:40px 32px 32px;
    border-radius:24px;
    background:linear-gradient(180deg,rgba(26,27,38,.92),rgba(20,21,30,.92));
    border:1px solid var(--line);
    box-shadow:0 24px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(0,212,255,.05) inset;
    backdrop-filter:blur(18px);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px}
  .logo{
    width:64px;height:64px;border-radius:18px;
    display:grid;place-items:center;
    font-weight:800;font-size:24px;letter-spacing:.5px;
    color:#04121a;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    box-shadow:0 8px 26px -6px rgba(0,212,255,.55),0 0 0 1px rgba(255,255,255,.12) inset;
  }
  .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  .brand p{margin:0;font-size:13px;color:var(--muted)}

  .field{position:relative;margin-bottom:14px}
  .field .icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:14px;pointer-events:none;transition:color .15s;
  }
  .field input{
    width:100%;
    padding:14px 44px 14px 40px;
    font-size:14px;
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .field input::placeholder{color:#5b6076}
  .field input:focus{
    border-color:rgba(0,212,255,.65);
    box-shadow:0 0 0 4px rgba(0,212,255,.12);
  }
  .field input:focus + .icon,
  .field:focus-within .icon{color:var(--cyan)}

  .toggle-pwd{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border:0;border-radius:10px;
    background:transparent;color:var(--muted);cursor:pointer;
    display:grid;place-items:center;transition:color .15s,background .15s;
  }
  .toggle-pwd:hover{color:var(--text);background:rgba(255,255,255,.05)}

  .error{
    display:none;
    align-items:center;gap:8px;
    font-size:13px;color:var(--danger);
    background:rgba(255,92,122,.09);
    border:1px solid rgba(255,92,122,.25);
    border-radius:12px;
    padding:10px 12px;margin:4px 0 14px;
  }
  .error.show{display:flex}

  .btn{
    width:100%;
    margin-top:6px;
    padding:14px;
    font-size:14px;font-weight:600;
    color:#04121a;
    border:0;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    transition:transform .12s,box-shadow .15s,opacity .15s;
    box-shadow:0 10px 30px -10px rgba(0,212,255,.6);
  }
  .btn:hover{box-shadow:0 14px 36px -10px rgba(123,97,255,.7)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn .spin{display:none;margin-right:8px;animation:spin .8s linear infinite}
  .btn.loading .spin{display:inline-block}
  .btn.loading .label{opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}

  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
  .foot .dot{color:var(--cyan)}
  .hint{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);text-align:center;line-height:1.6;
  }
  .hint code{color:var(--cyan);background:rgba(0,212,255,.08);padding:1px 6px;border-radius:6px;font-size:11px}
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>

  <div class="card">
    <div class="brand">
      <div class="logo">SL</div>
      <h1>boss.slilelo</h1>
      <p id="subtitle">เข้าสู่ระบบเพื่อใช้งาน</p>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <input id="username" name="username" type="text"
               autocomplete="username" placeholder="ชื่อผู้ใช้"
               spellcheck="false" autocapitalize="none" required>
        <i class="fas fa-user icon"></i>
      </div>

      <div class="field">
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="รหัสผ่าน" required>
        <i class="fas fa-lock icon"></i>
        <button type="button" class="toggle-pwd" id="toggle" aria-label="แสดงรหัสผ่าน">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div class="error" id="error">
        <i class="fas fa-circle-exclamation"></i>
        <span id="error-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
      </div>

      <button class="btn" id="submit" type="submit">
        <i class="fas fa-circle-notch spin"></i>
        <span class="label">เข้าสู่ระบบ</span>
      </button>
    </form>

    <div class="hint" id="hint">
      ผู้ใช้หลักคือ <code>root</code> — ใช้รหัสผ่านเดิมของระบบ
    </div>

    <div class="foot">
      <span class="dot">●</span> NovaAgent · Astra Console
    </div>
  </div>

<script>
(function(){
  const form = document.getElementById('login-form');
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('password');
  const errBox = document.getElementById('error');
  const errTxt = document.getElementById('error-text');
  const btn = document.getElementById('submit');
  const toggle = document.getElementById('toggle');

  toggle.addEventListener('click', () => {
    const show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    toggle.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  [userEl, passEl].forEach(el => el.addEventListener('input', () => {
    errBox.classList.remove('show');
  }));

  function fail(msg){
    errTxt.textContent = msg;
    errBox.classList.add('show');
    passEl.focus();
    passEl.select();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = userEl.value.trim();
    const password = passEl.value;
    if (!username || !password) { fail('กรอกชื่อผู้ใช้และรหัสผ่านให้ครบก่อนนะคะ'); return; }

    btn.disabled = true;
    btn.classList.add('loading');
    errBox.classList.remove('show');

    try {
      // NOTE: preview only — endpoint จริงของระบบคือ POST /api/auth/login
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (data.status === 'success') {
        location.reload();
        return;
      }
      fail(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    } catch (err) {
      // preview fallback: ไม่มี backend ก็ยังโชว์ UX ได้
      fail('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (นี่คือหน้าพรีวิว)');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });

  userEl.focus();
})();
</script>
</body>
</html>
